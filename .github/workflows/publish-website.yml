name: Publish JustSessions website

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-website.yml'
      - 'website/**'
      - 'Scripts/Website/**'
      - 'Scripts/ReleaseNotes/**'
      - 'Sources/JustSessions/Resources/ReleaseNotes/**'
      - 'docs/images/**'
      - 'Branding/**'
      - 'README.md'
      - 'docs/guides/session-storage.md'
      - 'Sources/JustSessions/Models/Conversations/ConversationProvider.swift'
      - 'Sources/JustSessions/Services/Transcript/TranscriptLoader.swift'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

# Serialize the full workflow and build current main, including for manual reruns.
# Finish an active deployment before starting the next one.
concurrency:
  group: publish-website
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Record website source revision
        run: |
          revision="$(git rev-parse HEAD)"
          echo "Website source revision: $revision" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      # Release notes merge before their tag, so list only versions whose GitHub release is published.
      - name: Test and build website
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_PUBLISHED_RELEASE_TAG="$(gh release view --repo yangzichao/JustSessions --json tagName --jq .tagName)"
          export LATEST_PUBLISHED_RELEASE_TAG
          make website-check
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/JustSessions

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
