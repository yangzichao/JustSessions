name: Publish website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'Scripts/Website/**'
      - 'Sources/JustSessions/Models/Conversations/ConversationProvider.swift'
      - 'Sources/JustSessions/Services/Transcript/TranscriptLoader.swift'
      - 'README.md'
      - 'docs/guides/session-storage.md'
      - 'docs/images/**'
      - 'Branding/SVG/mark.svg'
      - 'Branding/PNG/app-icon-256.png'
      - '.github/workflows/publish-website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'Scripts/Website/**'
      - 'Sources/JustSessions/Models/Conversations/ConversationProvider.swift'
      - 'Sources/JustSessions/Services/Transcript/TranscriptLoader.swift'
      - 'README.md'
      - 'docs/guides/session-storage.md'
      - 'docs/images/**'
      - 'Branding/SVG/mark.svg'
      - 'Branding/PNG/app-icon-256.png'
      - '.github/workflows/publish-website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build and validate website
        run: |
          python3 -m unittest discover -s Scripts/Website/tests -v
          python3 Scripts/Website/build_site.py
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/JustSessions

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
