name: Publish app update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-app-update
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build app
        run: ./Scripts/build-app.sh
      - name: Verify and package
        run: |
          codesign --verify --deep --strict dist/JustSessions.app
          test "$(plutil -extract JustSessionsSourceRevision raw dist/JustSessions.app/Contents/Info.plist)" = "$GITHUB_SHA"
          test "$(plutil -extract CocaCodexSourceRevision raw dist/JustSessions.app/Contents/Info.plist)" = "$GITHUB_SHA"
          test "$(plutil -extract CFBundleDisplayName raw dist/JustSessions.app/Contents/Info.plist)" = "JustSessions"
          ditto -c -k --sequesterRsrc --keepParent dist/JustSessions.app dist/JustSessions.zip
          ditto dist/JustSessions.app dist/coca-codex.app
          codesign --verify --deep --strict dist/coca-codex.app
          ditto -c -k --sequesterRsrc --keepParent dist/coca-codex.app dist/coca-codex.zip
      - name: Publish GitHub build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-$GITHUB_SHA"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Build already published: $tag"
          else
            gh release create "$tag" dist/JustSessions.zip dist/coca-codex.zip \
              --target "$GITHUB_SHA" \
              --title "JustSessions ${GITHUB_SHA:0:7}" \
              --notes "Automatic JustSessions build from main. The coca-codex.zip asset supports updates from older installations." \
              --latest
          fi
