name: Publish app update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-app-update
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build app
        run: ./Scripts/build-app.sh
      - name: Verify and package
        run: |
          codesign --verify --deep --strict dist/coca-codex.app
          test "$(plutil -extract CocaCodexSourceRevision raw dist/coca-codex.app/Contents/Info.plist)" = "$GITHUB_SHA"
          ditto -c -k --sequesterRsrc --keepParent dist/coca-codex.app dist/coca-codex.zip
      - name: Publish GitHub build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-$GITHUB_SHA"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Build already published: $tag"
          else
            gh release create "$tag" dist/coca-codex.zip \
              --target "$GITHUB_SHA" \
              --title "coca-codex ${GITHUB_SHA:0:7}" \
              --notes "Automatic app build from main." \
              --latest
          fi
