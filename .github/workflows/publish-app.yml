name: Publish signed JustSessions update

# Publishes only when a version tag such as v0.17.0 is pushed.
# A manual run must also be started from a version tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-app-update
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read app version from tag
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != "tag" || ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Releases must run from a version tag like v0.17.0, not $GITHUB_REF_TYPE '$GITHUB_REF_NAME'." >&2
            exit 1
          fi
          printf 'APP_VERSION=%s\n' "${BASH_REMATCH[1]}" >> "$GITHUB_ENV"

      - name: Test
        run: swift test

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$APPLE_CERTIFICATE_P12_BASE64" || -z "$APPLE_CERTIFICATE_PASSWORD" ]]; then
            echo "Developer ID certificate secrets are missing." >&2
            exit 1
          fi
          keychain_path="$RUNNER_TEMP/justsessions-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          identity="$(security find-identity -v -p codesigning "$keychain_path" | awk -F '\"' '/Developer ID Application:/ { print $2; exit }')"
          if [[ -z "$identity" ]]; then
            echo "No Developer ID Application identity was imported." >&2
            exit 1
          fi
          printf 'CODE_SIGN_IDENTITY=%s\n' "$identity" >> "$GITHUB_ENV"
          printf 'SIGNING_KEYCHAIN_PATH=%s\n' "$keychain_path" >> "$GITHUB_ENV"

      - name: Build signed app
        run: |
          APP_BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 19)) ./Scripts/build-app.sh
          codesign --verify --deep --strict dist/JustSessions.app
          test "$(plutil -extract JustSessionsSourceRevision raw dist/JustSessions.app/Contents/Info.plist)" = "$GITHUB_SHA"
          test "$(plutil -extract CFBundleDisplayName raw dist/JustSessions.app/Contents/Info.plist)" = "JustSessions"
          test "$(plutil -extract CFBundleVersion raw dist/JustSessions.app/Contents/Info.plist)" = "$((GITHUB_RUN_NUMBER + 19))"
          test "$(plutil -extract CFBundleShortVersionString raw dist/JustSessions.app/Contents/Info.plist)" = "$APP_VERSION"
          codesign --display --verbose=2 dist/JustSessions.app 2>&1 | grep -F "Authority=Developer ID Application:"

      - name: Notarize and staple app
        env:
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          notary_key_path="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          notary_archive="$RUNNER_TEMP/JustSessions-notarization.zip"
          printf '%s' "$APPLE_NOTARY_KEY" > "$notary_key_path"
          chmod 600 "$notary_key_path"
          ditto -c -k --sequesterRsrc --keepParent dist/JustSessions.app "$notary_archive"
          xcrun notarytool submit "$notary_archive" \
            --key "$notary_key_path" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple dist/JustSessions.app
          xcrun stapler validate dist/JustSessions.app

      - name: Build, notarize, and staple installer DMG
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          notary_key_path="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          ./Scripts/build-dmg.sh dist/JustSessions.app dist/JustSessions.dmg
          codesign --verify --strict dist/JustSessions.dmg
          xcrun notarytool submit dist/JustSessions.dmg \
            --key "$notary_key_path" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple dist/JustSessions.dmg
          xcrun stapler validate dist/JustSessions.dmg
          spctl --assess --type open --context context:primary-signature --verbose=2 dist/JustSessions.dmg

      - name: Package app and generate Sparkle appcast
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          mkdir -p dist/sparkle-updates
          update_archive="dist/sparkle-updates/JustSessions.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/JustSessions.app "$update_archive"
          if gh release download --repo yangzichao/JustSessions --pattern appcast.xml \
            --dir dist/sparkle-updates; then
            echo "Continuing the existing Sparkle update feed."
          else
            echo "Starting a new Sparkle update feed."
          fi
          download_prefix="https://github.com/yangzichao/JustSessions/releases/download/$tag/"
          printf '%s' "$SPARKLE_EDDSA_PRIVATE_KEY" | \
            ./.build/artifacts/Sparkle/Sparkle/bin/generate_appcast \
              --ed-key-file - \
              --download-url-prefix "$download_prefix" \
              --embed-release-notes \
              dist/sparkle-updates
          grep -Fq "${download_prefix}JustSessions.zip" dist/sparkle-updates/appcast.xml
          codesign --verify --deep --strict dist/JustSessions.app
          spctl --assess --type execute --verbose=2 dist/JustSessions.app

      # The release is attached to the version tag that started this run.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          update_archive="dist/sparkle-updates/JustSessions.zip"
          if gh release view "$tag" --repo yangzichao/JustSessions >/dev/null 2>&1; then
            echo "Release already published: $tag"
          else
            gh release create "$tag" \
              dist/JustSessions.dmg \
              "$update_archive" \
              dist/sparkle-updates/appcast.xml \
              --repo yangzichao/JustSessions \
              --verify-tag \
              --title "JustSessions $tag" \
              --notes "Signed, notarized JustSessions build. To install, open JustSessions.dmg and drag JustSessions into Applications. Sparkle updates use appcast.xml and JustSessions.zip." \
              --latest
          fi
