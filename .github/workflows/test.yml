name: Test

# Only the Swift tests run here. Localization checks and opening the packaged app run locally with `make verify`.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # build-runtime.sh reuses a runtime built by the same scripts with the same SDK, so the key matches both.
      - name: Identify the macOS SDK
        id: macos-sdk
        run: printf 'path-hash=%s\n' "$(xcrun --sdk macosx --show-sdk-path | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore bundled tmux
        uses: actions/cache@v4
        with:
          path: |
            .build/Tmux/downloads
            .build/Tmux/*/runtime
          key: tmux-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Scripts/Tmux/**') }}-${{ steps.macos-sdk.outputs.path-hash }}
          # An older runtime is rebuilt, but its downloaded sources are reused.
          restore-keys: tmux-runtime-${{ runner.os }}-${{ runner.arch }}-

      - name: Build and verify bundled tmux
        run: |
          runtime_directory="$(./Scripts/Tmux/build-runtime.sh)"
          printf 'JUSTSESSIONS_TEST_TMUX_RUNTIME=%s\n' "$runtime_directory" >> "$GITHUB_ENV"

      - name: Test
        run: swift test
